// === HELPERS ===
const normalize = (s) => (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();

const expertKey = (name) => normalize(name);

const initials = (name) => {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  return (parts[0]?.[0] || '') + (parts[parts.length > 1 ? 1 : 0]?.[0] || '');
};

const colorFromName = (name) => {
  const colors = ['#f5c542', '#5b9fd6', '#a47ed1', '#4ecb71', '#e0943a', '#e05555', '#5fc7c0', '#d68bbf'];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return colors[Math.abs(h) % colors.length];
};

const STARTUP_ID = (s) => {
  const cohorte = s.cohorte;
  const list = RAW_DATA.startups.filter(x => x.cohorte === cohorte).sort((a,b) => a.name.localeCompare(b.name));
  const idx = list.findIndex(x => x.name === s.name);
  return `${cohorte}-${String(idx + 1).padStart(2, '0')}`;
};

// Time slot helpers
const DAYS_ES = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const FULL_DAYS_ES = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const MONTHS_ES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

const formatDate = (d) => `${d.getDate()} ${MONTHS_ES[d.getMonth()]}`;
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

// === Parse free-form availability into structured slots ===
// We generate a 4-week horizon from a base date (Mon Apr 27, 2026) and try to match natural language entries
const BASE_DATE = new Date(2026, 3, 27); // Apr 27, 2026 - Monday

const parseAvailability = (text) => {
  if (!text || text.toLowerCase().includes('sin respuesta')) return [];
  const slots = [];
  const lower = text.toLowerCase();

  // Heuristic 1: "any day at X" or "cualquier dia"
  if (lower.includes('cualquier dia') || lower.includes('cualquier día')) {
    const ranges = extractTimeRanges(lower);
    for (let day = 0; day < 20; day++) {
      const d = new Date(BASE_DATE);
      d.setDate(d.getDate() + day);
      if (d.getDay() === 0 || d.getDay() === 6) continue;
      ranges.forEach(([start, end]) => {
        slots.push({ date: ymd(d), start, end });
      });
    }
    return slots;
  }

  // Heuristic 2: day-specific entries like "Lun27 3-6pm" or "Mar28 9-11am"
  const dayPatterns = lower.match(/(lun|mar|mie|mié|jue|vie|sab|sáb|dom)\s*(\d{1,2})?[\s/]*(\d{1,2}\s*(?:am|pm|:\d{2})[^,;]*)/gi) || [];
  dayPatterns.forEach(p => {
    const dm = p.match(/(lun|mar|mie|mié|jue|vie|sab|sáb|dom)\s*(\d{1,2})?/i);
    if (!dm) return;
    const dayName = dm[1].toLowerCase().replace('mié','mie').replace('sáb','sab');
    const dayNum = dm[2] ? parseInt(dm[2]) : null;
    const dayMap = { lun: 1, mar: 2, mie: 3, jue: 4, vie: 5, sab: 6, dom: 0 };
    const targetDow = dayMap[dayName];
    const ranges = extractTimeRanges(p);
    if (ranges.length === 0) return;
    // find dates matching
    for (let day = 0; day < 28; day++) {
      const d = new Date(BASE_DATE);
      d.setDate(d.getDate() + day);
      if (d.getDay() !== targetDow) continue;
      if (dayNum !== null && d.getDate() !== dayNum) continue;
      ranges.forEach(([start, end]) => slots.push({ date: ymd(d), start, end }));
      if (dayNum !== null) break;
    }
  });

  // Heuristic 3: "Mar-Vie 8-9am" => Tue to Fri
  const rangePattern = lower.match(/(lun|mar|mie|mié|jue|vie)\s*-\s*(lun|mar|mie|mié|jue|vie)\s+([\d:apm\s-]+)/i);
  if (rangePattern && slots.length === 0) {
    const dayMap = { lun: 1, mar: 2, mie: 3, mié: 3, jue: 4, vie: 5 };
    const startD = dayMap[rangePattern[1].toLowerCase()];
    const endD = dayMap[rangePattern[2].toLowerCase()];
    const ranges = extractTimeRanges(rangePattern[3]);
    for (let day = 0; day < 20; day++) {
      const d = new Date(BASE_DATE);
      d.setDate(d.getDate() + day);
      if (d.getDay() < startD || d.getDay() > endD) continue;
      ranges.forEach(([start, end]) => slots.push({ date: ymd(d), start, end }));
    }
  }

  // Heuristic 4: time-only like "9:30am-2:30pm" => weekdays
  if (slots.length === 0) {
    const ranges = extractTimeRanges(lower);
    if (ranges.length > 0) {
      for (let day = 0; day < 14; day++) {
        const d = new Date(BASE_DATE);
        d.setDate(d.getDate() + day);
        if (d.getDay() === 0 || d.getDay() === 6) continue;
        ranges.forEach(([start, end]) => slots.push({ date: ymd(d), start, end }));
      }
    }
  }

  return dedupeSlots(slots);
};

const extractTimeRanges = (text) => {
  const ranges = [];
  // patterns like "11am-2pm", "9:30am-2:30pm", "3-6pm", "1-2pm o 5-6pm"
  const re = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*[-–]\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/gi;
  let m;
  while ((m = re.exec(text)) !== null) {
    let h1 = parseInt(m[1]);
    const min1 = m[2] ? parseInt(m[2]) : 0;
    let p1 = m[3]?.toLowerCase();
    let h2 = parseInt(m[4]);
    const min2 = m[5] ? parseInt(m[5]) : 0;
    const p2 = m[6].toLowerCase();
    if (!p1) p1 = p2; // "3-6pm" both pm
    if (p1 === 'pm' && h1 < 12) h1 += 12;
    if (p2 === 'pm' && h2 < 12) h2 += 12;
    if (p1 === 'am' && h1 === 12) h1 = 0;
    if (p2 === 'am' && h2 === 12) h2 = 0;
    ranges.push([h1 * 60 + min1, h2 * 60 + min2]);
  }
  return ranges;
};

const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromYmd = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dedupeSlots = (slots) => {
  const seen = new Set();
  return slots.filter(s => {
    const k = `${s.date}|${s.start}|${s.end}`;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
};

const minutesToTime = (m) => {
  const h = Math.floor(m / 60);
  const mm = m % 60;
  const period = h >= 12 ? 'pm' : 'am';
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${h12}:${String(mm).padStart(2,'0')} ${period}`;
};

// === Junta Directiva: per startup, list expert keys (Mentoría + 3 Consultorías + Plan Expansión) ===
const getStartupExperts = (startup) => {
  const seen = new Set();
  const experts = [];
  startup.services.forEach(svc => {
    if (svc.experto) {
      const k = expertKey(svc.experto);
      if (!seen.has(k)) {
        seen.add(k);
        experts.push({
          key: k,
          name: svc.experto,
          servicios: [svc.servicio + (svc.tema ? ' — ' + svc.tema : '')],
        });
      } else {
        const ex = experts.find(e => e.key === k);
        if (ex) ex.servicios.push(svc.servicio + (svc.tema ? ' — ' + svc.tema : ''));
      }
    }
  });
  return experts;
};

// === FIND BEST SLOTS (intersection of all experts' availability) ===
const findCommonSlots = (expertKeys, availabilityMap, durationMin = 60) => {
  // For each date, find time windows where all (or most) experts are available
  const dateSlots = {}; // date -> array of {expertKey, start, end}
  expertKeys.forEach(k => {
    const exp = availabilityMap[k];
    if (!exp) return;
    exp.slots.forEach(s => {
      if (!dateSlots[s.date]) dateSlots[s.date] = [];
      dateSlots[s.date].push({ expertKey: k, start: s.start, end: s.end });
    });
  });

  const candidates = [];
  Object.entries(dateSlots).forEach(([date, slotsForDate]) => {
    // For each 30-minute increment, count how many experts are available
    for (let t = 6 * 60; t < 20 * 60; t += 30) {
      const expEnd = t + durationMin;
      const availableExperts = slotsForDate.filter(s => s.start <= t && s.end >= expEnd).map(s => s.expertKey);
      const uniqAvail = [...new Set(availableExperts)];
      if (uniqAvail.length >= 2) {
        candidates.push({
          date, start: t, end: expEnd,
          availableExperts: uniqAvail,
          missingExperts: expertKeys.filter(k => !uniqAvail.includes(k)),
          score: uniqAvail.length / expertKeys.length,
        });
      }
    }
  });

  // Sort: highest coverage, then earliest
  candidates.sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    return a.start - b.start;
  });

  // Dedupe overlapping slots on same date
  const out = [];
  for (const c of candidates) {
    if (out.some(o => o.date === c.date && Math.abs(o.start - c.start) < 60 && o.score >= c.score)) continue;
    out.push(c);
    if (out.length >= 12) break;
  }
  return out;
};

// === SUGGEST: For a specific expert, find slots where MOST OTHER experts are available
// but this expert is NOT — these are the slots Sebas could ask the expert about
const suggestExpertSlots = (targetExpert, allExpertKeys, availabilityMap, durationMin = 60) => {
  const others = allExpertKeys.filter(k => k !== targetExpert);
  if (others.length === 0) return [];

  // For each date, find time windows where most OTHERS are available
  const dateSlots = {};
  others.forEach(k => {
    const exp = availabilityMap[k];
    if (!exp) return;
    exp.slots.forEach(s => {
      if (!dateSlots[s.date]) dateSlots[s.date] = [];
      dateSlots[s.date].push({ expertKey: k, start: s.start, end: s.end });
    });
  });

  const targetExp = availabilityMap[targetExpert];
  const targetSlotsByDate = {};
  if (targetExp) {
    targetExp.slots.forEach(s => {
      if (!targetSlotsByDate[s.date]) targetSlotsByDate[s.date] = [];
      targetSlotsByDate[s.date].push(s);
    });
  }

  const suggestions = [];
  Object.entries(dateSlots).forEach(([date, slotsForDate]) => {
    for (let t = 6 * 60; t < 20 * 60; t += 30) {
      const expEnd = t + durationMin;
      const availableOthers = [...new Set(slotsForDate.filter(s => s.start <= t && s.end >= expEnd).map(s => s.expertKey))];
      // Only suggest if most others are available (>= half)
      if (availableOthers.length < Math.max(1, Math.ceil(others.length / 2))) continue;
      // Only suggest if target expert is NOT already covering this slot
      const targetCovers = (targetSlotsByDate[date] || []).some(s => s.start <= t && s.end >= expEnd);
      if (targetCovers) continue;
      suggestions.push({
        date, start: t, end: expEnd,
        othersAvailable: availableOthers.length,
        totalOthers: others.length,
        coverage: availableOthers.length / others.length,
      });
    }
  });

  // Sort by coverage desc, then earliest
  suggestions.sort((a, b) => {
    if (b.coverage !== a.coverage) return b.coverage - a.coverage;
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    return a.start - b.start;
  });

  // Dedupe close slots
  const out = [];
  for (const c of suggestions) {
    if (out.some(o => o.date === c.date && Math.abs(o.start - c.start) < 60)) continue;
    out.push(c);
    if (out.length >= 4) break;
  }
  return out;
};

// === STORAGE ===
const useStorage = (key, defaultValue) => {
  const [value, setValue] = useState(defaultValue);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    (async () => {
      try {
        const result = await window.storage.get(key);
        if (result) setValue(JSON.parse(result.value));
      } catch (e) { /* not found */ }
      setLoaded(true);
    })();
  }, [key]);
  const update = async (newVal) => {
    setValue(newVal);
    try { await window.storage.set(key, JSON.stringify(newVal)); } catch (e) { console.error(e); }
  };
  return [value, update, loaded];
};

  const [expandedSlot, setExpandedSlot] = useState(null);
  const [duration, setDuration] = useState(60);
  const [showScheduleEditor, setShowScheduleEditor] = useState(false);
  const [scheduleDate, setScheduleDate] = useState(junta?.scheduledAt?.date || '');
  const [scheduleTime, setScheduleTime] = useState(junta?.scheduledAt?.time || '');
  const [scheduleNotes, setScheduleNotes] = useState(junta?.notes || '');

  const candidates = useMemo(() => findCommonSlots(expertKeys, availabilityMap, duration), [expertKeys, availabilityMap, duration]);
  const suggestionsByExpert = useMemo(() => {
    const m = {};
    expertKeys.forEach(k => {
      m[k] = suggestExpertSlots(k, expertKeys, availabilityMap, duration);
    });
    return m;
  }, [expertKeys, availabilityMap, duration]);
  const respondedCount = experts.filter(e => availabilityMap[e.key]?.estado === 'Respondio').length;

  const status = junta?.status || 'pending';

  const setStatusTo = (newStatus) => {
    if (newStatus === 'pending') {
      setJunta({ status: 'pending' });
      setShowScheduleEditor(false);
    } else if (newStatus === 'scheduled') {
      setShowScheduleEditor(true);
    } else if (newStatus === 'done') {
      if (junta?.scheduledAt) {
        setJunta({ ...junta, status: 'done', completedAt: Date.now() });
      } else {
        setShowScheduleEditor(true);
      }
    }
  };

  const saveSchedule = () => {
    if (!scheduleDate || !scheduleTime) return;
    setJunta({
      ...junta,
      status: 'scheduled',
      scheduledAt: { date: scheduleDate, time: scheduleTime },
      notes: scheduleNotes,
      updatedAt: Date.now(),
    });
    setShowScheduleEditor(false);
  };

  const formatScheduledDate = () => {
    if (!junta?.scheduledAt) return null;
    const d = fromYmd(junta.scheduledAt.date);
    return `${FULL_DAYS_ES[d.getDay() === 0 ? 6 : d.getDay() - 1]} ${d.getDate()} de ${MONTHS_ES[d.getMonth()]} · ${junta.scheduledAt.time}`;
  };

  return (
    <div>
      <button onClick={onBack} className="text-[#888] hover:text-white text-[13px] flex items-center gap-1.5 mb-5">
        <ChevronLeft size={15} /> Volver a juntas
      </button>

      <div className="flex items-start gap-5 mb-6">
        <div className="w-14 h-14 bg-[#f5c542]/15 rounded-xl grid place-items-center flex-shrink-0">
          <Building2 size={26} className="text-[#f5c542]" />
        </div>
        <div className="flex-1">
          <div className="flex items-center gap-2.5 mb-1">
            <span className="font-mono text-[11px] text-[#f5c542] bg-[#f5c542]/15 px-2 py-0.5 rounded font-bold">{STARTUP_ID(startup)}</span>
            <span className="text-[11px] text-[#888]">Cohorte {startup.cohorte}</span>
          </div>
          <h1 className="text-[28px] font-bold tracking-tight leading-tight">{startup.name}</h1>
          <div className="flex items-center gap-4 mt-2 text-[13px] text-[#888]">
            {startup.emprendedor && <span className="flex items-center gap-1.5"><UserCheck size={14}/> {startup.emprendedor}</span>}
            {startup.correo && <span className="flex items-center gap-1.5"><Mail size={14}/> {startup.correo}</span>}
          </div>
        </div>
      </div>

      {/* Status selector */}
      <div className="bg-[#141414] border border-[#242424] rounded-xl p-5 mb-5">
        <div className="flex items-center justify-between mb-3">
          <div className="text-[13px] font-semibold text-[#888] uppercase tracking-wider">Estado de la junta</div>
          {junta?.scheduledAt && status !== 'pending' && (
            <button onClick={() => setShowScheduleEditor(true)} className="text-[11px] text-[#888] hover:text-[#f5c542] flex items-center gap-1">
              <Edit2 size={11}/> Editar fecha
            </button>
          )}
        </div>

        <div className="grid grid-cols-3 gap-2 mb-3">
          {[
            { k: 'pending', label: 'Pendiente', icon: Clock, cls: 'border-[#e0943a] bg-[#e0943a]/15 text-[#e0943a]', inactive: 'border-[#242424] text-[#666] hover:border-[#e0943a]/40 hover:text-[#e0943a]' },
            { k: 'scheduled', label: 'Agendada', icon: Calendar, cls: 'border-[#4ecb71] bg-[#4ecb71]/15 text-[#4ecb71]', inactive: 'border-[#242424] text-[#666] hover:border-[#4ecb71]/40 hover:text-[#4ecb71]' },
            { k: 'done', label: 'Realizada', icon: Check, cls: 'border-[#888] bg-[#888]/15 text-white', inactive: 'border-[#242424] text-[#666] hover:border-[#888] hover:text-white' },
          ].map(({ k, label, icon: SIcon, cls, inactive }) => (
            <button key={k} onClick={() => setStatusTo(k)} className={`px-3 py-2.5 rounded-lg border text-[12.5px] font-medium flex items-center justify-center gap-1.5 transition-all ${status === k ? cls : inactive}`}>
              <SIcon size={13}/> {label}
            </button>
          ))}
        </div>

        {junta?.scheduledAt && !showScheduleEditor && (
          <div className="bg-[#0f0f0f] rounded-lg p-3.5 flex items-start gap-3">
            <div className={`w-8 h-8 rounded-lg grid place-items-center flex-shrink-0 ${status === 'done' ? 'bg-[#888]/20 text-[#888]' : 'bg-[#4ecb71]/20 text-[#4ecb71]'}`}>
              <Calendar size={15}/>
            </div>
            <div className="flex-1">
              <div className="text-[14px] font-semibold">{formatScheduledDate()}</div>
              {junta.notes && <div className="text-[12px] text-[#888] mt-0.5">{junta.notes}</div>}
            </div>
          </div>
        )}

        {showScheduleEditor && (
          <div className="bg-[#0f0f0f] rounded-lg p-4 space-y-3">
            <div className="text-[12px] text-[#888] mb-1">Registra cuándo se hará (o se hizo) la junta</div>
            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="text-[11px] text-[#888] block mb-1">Fecha</label>
                <input type="date" value={scheduleDate} onChange={e => setScheduleDate(e.target.value)} className="w-full bg-[#141414] border border-[#242424] rounded-md px-3 py-2 text-[13px] focus:border-[#f5c542] focus:outline-none"/>
              </div>
              <div>
                <label className="text-[11px] text-[#888] block mb-1">Hora</label>
                <input type="time" value={scheduleTime} onChange={e => setScheduleTime(e.target.value)} className="w-full bg-[#141414] border border-[#242424] rounded-md px-3 py-2 text-[13px] focus:border-[#f5c542] focus:outline-none"/>
              </div>
            </div>
            <div>
              <label className="text-[11px] text-[#888] block mb-1">Notas (opcional)</label>
              <input type="text" value={scheduleNotes} onChange={e => setScheduleNotes(e.target.value)} placeholder="Ej. link Meet, asistentes confirmados..." className="w-full bg-[#141414] border border-[#242424] rounded-md px-3 py-2 text-[13px] focus:border-[#f5c542] focus:outline-none"/>
            </div>
            <div className="flex gap-2">
              <button onClick={() => setShowScheduleEditor(false)} className="flex-1 bg-[#141414] border border-[#242424] rounded-md py-2 text-[12px] hover:bg-[#1a1a1a]">Cancelar</button>
              <button onClick={saveSchedule} disabled={!scheduleDate || !scheduleTime} className="flex-1 bg-[#f5c542] text-black rounded-md py-2 text-[12px] font-semibold disabled:opacity-40 disabled:cursor-not-allowed">Guardar</button>
            </div>
          </div>
        )}
      </div>

      {/* Expert proposals banner */}
      {(() => {
        const proposals = [];
        Object.entries(RAW_DATA.expert_proposals || {}).forEach(([expKey, byStartup]) => {
          if (byStartup[startup.name]) {
            const exp = availabilityMap[expKey];
            proposals.push({ expKey, name: exp?.name || expKey, ...byStartup[startup.name] });
          }
        });
        if (proposals.length === 0) return null;
        return (
          <div className="bg-gradient-to-r from-[#a47ed1]/15 to-transparent border border-[#a47ed1]/30 rounded-xl p-5 mb-5">
            <div className="flex items-start gap-4">
              <div className="w-10 h-10 rounded-lg bg-[#a47ed1]/20 grid place-items-center flex-shrink-0">
                <Bell size={18} className="text-[#a47ed1]"/>
              </div>
              <div className="flex-1">
                <div className="text-[13px] text-[#a47ed1] font-semibold mb-2">Propuesta horaria recibida del experto</div>
                {proposals.map(p => (
                  <div key={p.expKey} className="text-[14px] mb-1">
                    <b>{p.name}</b> propone: <span className="font-mono bg-[#a47ed1]/15 text-[#a47ed1] px-2 py-0.5 rounded text-[12px] ml-1">Jueves 30 abr · {p.time}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Experts panel with per-expert suggestions */}
      <div className="bg-[#141414] border border-[#242424] rounded-xl p-6 mb-5">
        <div className="flex items-center justify-between mb-4">
          <div>
            <h3 className="text-[15px] font-semibold mb-0.5">Mini Junta Directiva · {experts.length} expertos</h3>
            <p className="text-[12px] text-[#888]">
              <span className={respondedCount === experts.length ? 'text-[#4ecb71]' : 'text-[#e0943a]'}>{respondedCount} de {experts.length}</span> han enviado disponibilidad
            </p>
          </div>
          <button onClick={onOpenExpertView} className="text-[12px] text-[#f5c542] flex items-center gap-1.5 hover:underline">
            <Send size={12}/> Ver vista pública del experto
          </button>
        </div>
        <div className="space-y-2.5">
          {experts.map(e => {
            const exp = availabilityMap[e.key];
            const responded = exp?.estado === 'Respondio';
            const suggestions = suggestionsByExpert[e.key] || [];

            return (
              <div key={e.key} className="bg-[#0f0f0f] border border-[#242424] rounded-lg p-3.5 grid grid-cols-1 md:grid-cols-[1fr_auto] gap-3">
                <div className="flex items-start gap-3 min-w-0">
                  <div className="w-9 h-9 rounded-full grid place-items-center text-[12px] font-bold flex-shrink-0" style={{ backgroundColor: colorFromName(e.name) + '30', color: colorFromName(e.name) }}>
                    {initials(e.name)}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-0.5">
                      <span className="font-medium text-[13px] truncate">{e.name}</span>
                      <div className={`w-1.5 h-1.5 rounded-full ${responded ? 'bg-[#4ecb71]' : 'bg-[#e0943a]'}`}></div>
                    </div>
                    <div className="text-[10.5px] text-[#888] mb-1">{exp?.role || '—'} · {e.servicios.length} servicio{e.servicios.length > 1 ? 's' : ''}</div>
                    {exp?.email && (
                      <a href={`mailto:${exp.email}`} className="text-[10.5px] text-[#666] truncate hover:text-[#f5c542] block">{exp.email}</a>
                    )}
                    {responded && exp?.disponibilidad && (
                      <div className="text-[10.5px] text-[#888] mt-1.5 italic line-clamp-2">"{exp.disponibilidad}"</div>
                    )}
                  </div>
                </div>

                {/* Per-expert suggestions */}
                <div className="md:max-w-[320px] md:border-l md:border-[#242424] md:pl-3">
                  {!responded ? (
                    <div className="text-[11px]">
                      <div className="text-[#e0943a] font-semibold mb-1 flex items-center gap-1"><AlertCircle size={11}/> Sin disponibilidad cargada</div>
                      <div className="text-[#666] leading-snug">Cuando responda, aquí verás sugerencias.</div>
                    </div>
                  ) : suggestions.length === 0 ? (
                    <div className="text-[11px]">
                      <div className="text-[#4ecb71] font-semibold mb-1 flex items-center gap-1"><Check size={11}/> Buenos cruces</div>
                      <div className="text-[#666] leading-snug">Su disponibilidad cubre los slots comunes.</div>
                    </div>
                  ) : (
                    <div>
                      <div className="text-[10.5px] font-semibold text-[#f5c542] uppercase tracking-wider mb-1.5 flex items-center gap-1">
                        <Sparkles size={10}/> Pregúntale si puede:
                      </div>
                      <div className="space-y-1">
                        {suggestions.slice(0, 3).map((s, i) => {
                          const d = fromYmd(s.date);
                          const day = DAYS_ES[d.getDay() === 0 ? 6 : d.getDay() - 1];
                          return (
                            <div key={i} className="bg-[#141414] rounded px-2 py-1.5 text-[11px] flex items-center justify-between gap-2 hover:bg-[#1a1a1a]">
                              <span>
                                <b>{day} {d.getDate()} {MONTHS_ES[d.getMonth()]}</b> · {minutesToTime(s.start)}
                              </span>
                              <span className="text-[#4ecb71] font-mono text-[10px]">+{s.othersAvailable}/{s.totalOthers}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Slot recommendations - main intersection finder */}
      <div className="bg-[#141414] border border-[#242424] rounded-xl p-6">
        <div className="flex items-center justify-between mb-1">
          <h3 className="text-[15px] font-semibold flex items-center gap-2">
            <Sparkles size={15} className="text-[#f5c542]"/> Slots comunes — cruce de disponibilidades
          </h3>
          <div className="flex items-center gap-2">
            <span className="text-[11px] text-[#888]">Duración:</span>
            <select value={duration} onChange={e => setDuration(parseInt(e.target.value))} className="bg-[#0f0f0f] border border-[#242424] rounded-md px-2 py-1 text-[12px]">
              <option value={30}>30 min</option>
              <option value={45}>45 min</option>
              <option value={60}>1 h</option>
              <option value={90}>1.5 h</option>
            </select>
          </div>
        </div>
        <p className="text-[12px] text-[#888] mb-5">Mejores ventanas según las disponibilidades cargadas. Click en un slot para ver el detalle expert por experto.</p>

        {candidates.length === 0 ? (
          <div className="text-center py-12 text-[#888] text-[13px]">
            <AlertCircle size={28} className="mx-auto mb-3 opacity-40"/>
            No hay slots comunes con la disponibilidad actual.<br/>
            <span className="text-[11px]">Solicita disponibilidad a los {experts.length - respondedCount} expertos pendientes o revisa las sugerencias arriba.</span>
          </div>
        ) : (
          <div className="space-y-2.5">
            {candidates.map((slot, i) => (
              <SlotCandidate key={i} slot={slot} expertKeys={expertKeys} availabilityMap={availabilityMap}
                expanded={expandedSlot === i} onToggle={() => setExpandedSlot(expandedSlot === i ? null : i)} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

// === MAIN APP ===
function App() {
  const [view, setView] = useState('juntas');
  const [selectedStartupName, setSelectedStartupName] = useState(null);
  const [expertViewKey, setExpertViewKey] = useState(null);
  const [filter, setFilter] = useState('all'); // all, c1, c2, pending, scheduled
  const [search, setSearch] = useState('');

  const [juntas, setJuntas, juntasLoaded] = useStorage('aldea_juntas_v1', {});
  const [expertOverrides, setExpertOverrides, overridesLoaded] = useStorage('aldea_expert_avail_v1', {});

  const availabilityMap = useMemo(() => {
    const base = buildAvailabilityMap();
    Object.entries(expertOverrides).forEach(([k, v]) => {
      if (base[k]) {
        base[k] = {
          ...base[k],
          disponibilidad: v,
          estado: v && v.trim() ? 'Respondio' : base[k].estado,
          slots: parseAvailability(v),
        };
      }
    });
    return base;
  }, [expertOverrides]);

  const updateExpertAvailability = (key, text) => {
    setExpertOverrides({ ...expertOverrides, [key]: text });
  };

  const setJuntaForStartup = (startupName, junta) => {
    setJuntas({ ...juntas, [startupName]: junta });
  };

  const filteredStartups = useMemo(() => {
    return RAW_DATA.startups.filter(s => {
      if (filter === 'c1' && s.cohorte !== 'C1') return false;
      if (filter === 'c2' && s.cohorte !== 'C2') return false;
      const j = juntas[s.name];
      const st = j?.status || 'pending';
      if (filter === 'pending' && st !== 'pending') return false;
      if (filter === 'scheduled' && st !== 'scheduled') return false;
      if (filter === 'done' && st !== 'done') return false;
      if (search && !s.name.toLowerCase().includes(search.toLowerCase()) && !s.emprendedor?.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });
  }, [filter, search, juntas]);

  const stats = useMemo(() => {
    const total = RAW_DATA.startups.length;
    const scheduled = Object.values(juntas).filter(j => j.status === 'scheduled').length;
    const done = Object.values(juntas).filter(j => j.status === 'done').length;
    const allExpertKeys = new Set();
    RAW_DATA.startups.forEach(s => getStartupExperts(s).forEach(e => allExpertKeys.add(e.key)));
    const respondedExperts = [...allExpertKeys].filter(k => availabilityMap[k]?.estado === 'Respondio').length;
    return { total, scheduled, done, respondedExperts, totalExperts: allExpertKeys.size };
  }, [juntas, availabilityMap]);

  const juntasCount = stats.total;

  if (!juntasLoaded || !overridesLoaded) {
    return <div className="min-h-screen bg-[#0a0a0a] grid place-items-center text-[#888]">Cargando...</div>;
  }

  // Public expert view
  if (expertViewKey) {
    return <ExpertPublicView expertKey={expertViewKey} availabilityMap={availabilityMap} updateExpertAvailability={updateExpertAvailability} onBack={() => setExpertViewKey(null)} />;
  }

  const selectedStartup = selectedStartupName ? RAW_DATA.startups.find(s => s.name === selectedStartupName) : null;

  // Admin views
  return (
    <div className="min-h-screen bg-[#0a0a0a] text-white">
      <Sidebar view={view} setView={(v) => { setView(v); setSelectedStartupName(null); }} juntasCount={juntasCount} />

      <main className="ml-60 p-8 max-w-[calc(100vw-240px)]">
        <TopBar
          crumbs={selectedStartup ? ['Admin', 'ALDEA+', 'Mini Juntas', STARTUP_ID(selectedStartup)] : ['Admin', 'ALDEA+', 'Mini Juntas Directivas']}
          onPublicView={() => {
            const firstKey = Object.keys(availabilityMap)[0];
            setExpertViewKey(firstKey);
          }}
        />

        {!selectedStartup && (
          <>
            <div className="flex items-start gap-4 mb-7">
              <div className="w-12 h-12 bg-[#f5c542]/15 rounded-xl grid place-items-center">
                <Calendar size={24} className="text-[#f5c542]"/>
              </div>
              <div>
                <h1 className="text-[28px] font-bold tracking-tight leading-tight">Mini Juntas Directivas</h1>
                <p className="text-[13px] text-[#888] mt-0.5">Coordinación de sesiones de alineación entre expertos por startup · sin emprendedor</p>
              </div>
            </div>

            <div className="grid grid-cols-4 gap-3.5 mb-7">
              <StatCard icon={Building2} color="yellow" value={stats.total} label="Startups C1+C2" sub="cohortes activas"/>
              <StatCard icon={Users} color="blue" value={`${stats.respondedExperts}/${stats.totalExperts}`} label="Expertos con disponibilidad" sub={`${Math.round(stats.respondedExperts/stats.totalExperts*100)}% completado`}/>
              <StatCard icon={Sparkles} color="purple" value={stats.scheduled} label="Juntas agendadas" sub="con fecha confirmada"/>
              <StatCard icon={Check} color="green" value={stats.done} label="Juntas realizadas" sub={`de ${stats.total} totales`}/>
            </div>

            <div className="flex items-center gap-3 mb-5 pb-4 border-b border-[#242424]">
              <div className="flex gap-1 bg-[#141414] p-1 rounded-lg border border-[#242424]">
                {[
                  { k: 'all', label: 'Todas' },
                  { k: 'c1', label: 'Cohorte 1' },
                  { k: 'c2', label: 'Cohorte 2' },
                  { k: 'pending', label: 'Pendientes' },
                  { k: 'scheduled', label: 'Agendadas' },
                  { k: 'done', label: 'Realizadas' },
                ].map(({ k, label }) => (
                  <button key={k} onClick={() => setFilter(k)} className={`px-3.5 py-1.5 text-[12.5px] font-medium rounded-md transition-all ${filter === k ? 'bg-[#f5c542] text-black' : 'text-[#888] hover:text-white'}`}>
                    {label}
                  </button>
                ))}
              </div>
              <div className="flex-1"></div>
              <div className="bg-[#141414] border border-[#242424] rounded-lg px-3 py-1.5 flex items-center gap-2 w-64">
                <Search size={13} className="text-[#555]"/>
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar startup..." className="bg-transparent outline-none text-[12.5px] flex-1"/>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4 mb-12">
              {filteredStartups.map(s => (
                <StartupCard key={s.name} startup={s} junta={juntas[s.name]} availabilityMap={availabilityMap} onClick={() => setSelectedStartupName(s.name)} />
              ))}
            </div>

            {filteredStartups.length === 0 && (
              <div className="text-center py-16 text-[#888]">
                <Building2 size={32} className="mx-auto mb-3 opacity-40"/>
                No hay startups que coincidan con el filtro
              </div>
            )}
          </>
        )}

        {selectedStartup && (
          <StartupDetailView
            startup={selectedStartup}
            junta={juntas[selectedStartup.name] || { status: 'pending' }}
            setJunta={(j) => setJuntaForStartup(selectedStartup.name, j)}
            availabilityMap={availabilityMap}
            onBack={() => setSelectedStartupName(null)}
            onOpenExpertView={() => {
              const experts = getStartupExperts(selectedStartup);
              if (experts[0]) setExpertViewKey(experts[0].key);
            }}
          />
        )}
      </main>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
